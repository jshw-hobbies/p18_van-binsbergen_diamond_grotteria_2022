name: Python tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0   # no short @v10 tag exists, so give the full version
        with:
          enable-cache: true
      - name: Install the environment from uv.lock
        run: uv sync --locked
      - name: Lint with ruff
        run: uv run ruff check .
      - name: Run tests (except those needing WRDS or other credentials)
        run: uv run pytest -m "not wrds"